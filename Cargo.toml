[package]
name = "dynamite-tts"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Highlight-to-speech tray app: Phonon in-process, Kokoro and Summary/Explain through a local Lemonade server"
license = "MIT"
repository = "https://github.com/robrab2000/dynamite-tts"
publish = false

[[bin]]
name = "dynamite-tts"
path = "src/main.rs"

[dependencies]
# The Phonon runtime (gradium-ai/xn-ptts). `hf` brings the tokenizer every checkpoint ships;
# `hub` is left out on purpose: the app downloads the pinned files itself.
ptts = { version = "0.6.0", features = ["hf"] }
# ptts's tensor runtime, for the CPU thread count. Keep the version in step with ptts.
xn = "0.2.13"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
url = "2"
dirs = "6"
sha2 = "0.10"
ureq = "3"
cpal = "0.16"
interprocess = "2"
tao = "0.37"
tray-icon = "0.26"
global-hotkey = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
# Text for the status pill (and its renderer tests on every platform).
fontdue = "0.9"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

# On Apple Silicon xn hands its f32 matrix products to the Accelerate framework (AMX-backed
# BLAS): measured 29-35x realtime on an M1 Max against 25x with the plain NEON kernels.
[target.'cfg(all(target_arch = "aarch64", target_vendor = "apple"))'.dependencies]
ptts = { version = "0.6.0", features = ["hf", "accelerate"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
arboard = "3"
softbuffer = "0.4"


[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"
# AT-SPI (the accessibility bus), for the text around the highlight. notify-rust already uses it.
zbus = "5"

[dev-dependencies]
# For examples/make_icons.rs, which regenerates assets/icons from assets/logo.png.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
icns = "0.5"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
# Nested `if let` reads better than let-chains for the platform code here.
collapsible_if = "allow"
too_many_arguments = "allow"
