name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore DynamiteTts.sln

      - name: Test
        run: dotnet test DynamiteTts.sln -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: ./publish.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem artifacts/DynamiteTts-win-x64-v*.zip | Select-Object -First 1
          if (-not $zip) { throw "Release zip not found under artifacts/" }
          $tag = "${{ github.ref_name }}"
          $notes = @"
          Unsigned Windows self-contained build ($($zip.Name)).

          SmartScreen may warn until the app is code-signed — More info → Run anyway.

          Keep the ``voices`` folder next to ``DynamiteTts.exe``. The Kokoro model downloads on first use if not bundled.
          "@
          # Create the release, or replace assets if it already exists (e.g. manual local upload).
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip.FullName --clobber
          } else {
            gh release create $tag $zip.FullName --title "Dynamite TTS $tag" --notes $notes
          }
