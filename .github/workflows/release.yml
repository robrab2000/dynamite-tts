name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Restore
        run: dotnet restore DynamiteTts.sln

      - name: Test
        run: dotnet test DynamiteTts.sln -c Release --no-restore

      - name: Publish
        shell: pwsh
        run: ./publish.ps1

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zip = Get-ChildItem artifacts/DynamiteTts-win-x64-v*.zip | Select-Object -First 1
          $setup = Get-ChildItem artifacts/DynamiteTts-Setup-v*.exe | Select-Object -First 1
          if (-not $zip) { throw "Release zip not found under artifacts/" }
          if (-not $setup) { throw "Setup.exe not found under artifacts/ (is Inno Setup installed?)" }

          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## Install
          Prefer **``$($setup.Name)``** — installs to ``%LocalAppData%\Programs\DynamiteTTS``, adds a Start Menu shortcut, optionally starts at sign-in, then launches the app.

          Portable zip: ``$($zip.Name)`` (same files, no installer).

          ## Notes
          - Builds are **unsigned**; SmartScreen may warn — More info → Run anyway.
          - Requires 64-bit Windows 10 1809+ or Windows 11.
          - Self-contained (no separate .NET install). The Kokoro voice model is bundled so speech works on first launch.
          - Optional GPU acceleration may download the CUDA runtime (~1 GB) on first use.
          - Summary mode still needs a local [Lemonade Server](https://lemonade-server.ai) install.
          "@

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName $zip.FullName --clobber
          } else {
            gh release create $tag $setup.FullName $zip.FullName --title "Dynamite TTS $tag" --notes $notes
          }
