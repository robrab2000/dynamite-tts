name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Test
        run: cargo test --locked --release
      - name: Build zip and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1 -Version ("${{ github.ref_name }}".TrimStart("v"))
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            target/windows/DynamiteTts-win-x64-v*.zip
            target/windows/DynamiteTts-Setup-v*.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --locked --release
      - name: Build the app
        run: ./packaging/macos/package-app.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/DynamiteTTS-macos-arm64-v*.zip

  linux:
    # The oldest supported runner, so the binary runs on any newer glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --locked --release
      - name: Build the tarball
        run: ./packaging/linux/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/linux/DynamiteTts-linux-x64-v*.tar.gz

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Write the release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          # This tag's section of CHANGELOG.md, without its heading.
          awk -v tag="## ${tag}" '$0 == tag {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "_No CHANGELOG.md entry for ${tag}._" > notes.md
          fi
          cat >> notes.md <<NOTES

          ## Install
          - **Windows 10/11 (64-bit):** run \`DynamiteTts-Setup-${tag}.exe\` (portable: the \`win-x64\` zip).
          - **macOS 14+ (Apple Silicon):** unzip \`DynamiteTTS-macos-arm64-${tag}.zip\`, move DynamiteTTS.app to Applications, open it, and allow it under Privacy & Security → Accessibility.
          - **Linux (Ubuntu 22.04+):** unpack \`DynamiteTts-linux-x64-${tag}.tar.gz\` and run \`./install.sh\`.

          Builds are not code-signed yet, so SmartScreen and Gatekeeper may ask you to confirm the first launch. x86-64 builds need an AVX2 CPU. The Phonon English model is bundled, so Verbatim speech works offline; Summary and Explain need a local [Lemonade Server](https://lemonade-server.ai). See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/${tag}/README.md) for details.
          NOTES
          sed -i 's/^          //' notes.md
          cat notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          ls -la artifacts
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --title "Dynamite TTS $tag" --notes-file notes.md
          fi
